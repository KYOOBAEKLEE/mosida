<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>모바일 청첩장</title>
<meta name="robots" content="noindex" />
<meta property="og:title" content="저희 결혼합니다" />
<meta property="og:description" content="소중한 분들을 초대합니다" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Hahmlet:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<main id="app">
  <!-- 표지 -->
  <section class="cover">
    <div class="sky" aria-hidden="true">
      <span class="cloud c1"></span>
      <span class="cloud c2"></span>
      <span class="cloud c3"></span>
    </div>
    <p class="cover-eyebrow reveal">THE WEDDING DAY</p>
    <h1 class="cover-names reveal">
      <span data-bind="groom.name"></span>
      <em>&amp;</em>
      <span data-bind="bride.name"></span>
    </h1>
    <figure class="cover-photo reveal">
      <img data-src="cover.photo" alt="웨딩 사진" />
    </figure>
    <div class="cover-meta reveal">
      <p class="cover-date" data-bind="fmt.coverDate"></p>
      <p class="cover-venue" data-bind="fmt.coverVenue"></p>
    </div>
    <div class="scroll-hint" aria-hidden="true"><span></span></div>
  </section>

  <!-- 초대글 -->
  <section class="section greeting">
    <div class="ornament reveal" aria-hidden="true">
      <svg viewBox="0 0 64 24" width="52" height="20"><g fill="currentColor"><ellipse cx="26" cy="14" rx="14" ry="7"/><ellipse cx="15" cy="16" rx="9" ry="5"/><ellipse cx="38" cy="16" rx="10" ry="5"/><ellipse cx="29" cy="9" rx="9" ry="6"/><ellipse cx="53" cy="8" rx="7" ry="3.5" opacity="0.5"/></g></svg>
    </div>
    <h2 class="section-title reveal" data-bind="greeting.title"></h2>
    <p class="greeting-message reveal" data-bind="greeting.message"></p>
    <div class="parents card reveal">
      <p><span data-bind="groom.father"></span> · <span data-bind="groom.mother"></span>의 <span data-bind="groom.order"></span> <b data-bind="groom.name"></b></p>
      <p><span data-bind="bride.father"></span> · <span data-bind="bride.mother"></span>의 <span data-bind="bride.order"></span> <b data-bind="bride.name"></b></p>
    </div>
    <div class="contact-row reveal">
      <a class="btn" data-tel="groom.phone">신랑에게 연락하기</a>
      <a class="btn" data-tel="bride.phone">신부에게 연락하기</a>
    </div>
  </section>

  <!-- 예식 안내 -->
  <section class="section when">
    <p class="section-label reveal">SAVE THE DATE</p>
    <h2 class="section-title reveal">예식 안내</h2>
    <p class="when-date reveal" data-bind="fmt.fullDate"></p>
    <div class="calendar-card card reveal">
      <div class="calendar" id="calendar" aria-label="예식일 달력"></div>
    </div>
    <p class="dday reveal" id="dday"></p>
  </section>

  <!-- 갤러리 -->
  <section class="section gallery-section">
    <p class="section-label reveal">GALLERY</p>
    <h2 class="section-title reveal">우리의 순간</h2>
    <div class="gallery reveal" id="gallery"></div>
  </section>

  <!-- 오시는 길 -->
  <section class="section where">
    <p class="section-label reveal">LOCATION</p>
    <h2 class="section-title reveal">오시는 길</h2>
    <div class="where-card card reveal">
      <p class="where-venue"><b data-bind="wedding.venueName"></b> <span data-bind="wedding.hall"></span></p>
      <p class="where-address" data-bind="wedding.address"></p>
      <div class="map-buttons">
        <a class="btn" id="kakao-map" target="_blank" rel="noopener">카카오맵</a>
        <a class="btn" id="naver-map" target="_blank" rel="noopener">네이버지도</a>
        <button class="btn" id="copy-address">주소 복사</button>
      </div>
    </div>
  </section>

  <!-- 마음 전하실 곳 -->
  <section class="section money">
    <p class="section-label reveal">WITH LOVE</p>
    <h2 class="section-title reveal">마음 전하실 곳</h2>
    <p class="money-note reveal">참석이 어려워 마음만 전하고 싶으신 분들을 위해<br />계좌번호를 안내드립니다.</p>
    <div class="accordion reveal" id="accounts"></div>
  </section>

  <!-- 푸터 -->
  <footer class="footer">
    <div class="footer-sky" aria-hidden="true">
      <span class="cloud c1"></span>
      <span class="cloud c2"></span>
    </div>
    <p class="footer-names">
      <span data-bind="groom.name"></span> <em>&amp;</em> <span data-bind="bride.name"></span>
    </p>
    <button class="btn btn-share" id="share">청첩장 공유하기</button>
    <p class="footer-brand">모시다 · mosida</p>
  </footer>
</main>

<div class="lightbox" id="lightbox" hidden>
  <img id="lightbox-img" alt="사진 크게 보기" />
</div>

<div class="toast" id="toast" role="status"></div>

<script src="data.js"></script>
<script>window.INVITE.bgm = { src: "/assets/bgm/serene.wav" };</script>
<script src="invite.js"></script>
<script src="/assets/bgm.js"></script>
</body>
</html>
