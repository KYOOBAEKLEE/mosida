<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>모바일 청첩장</title>
<meta name="robots" content="noindex" />
<meta property="og:title" content="저희 결혼합니다" />
<meta property="og:description" content="소중한 분들을 초대합니다" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Hahmlet:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<main id="app">
  <!-- 표지 -->
  <section class="cover">
    <div class="petals" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <svg class="branch" aria-hidden="true" viewBox="0 0 320 90" fill="none">
      <path d="M8 72 C 80 58, 150 30, 312 14" stroke="#c9a3ab" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M96 52 C 110 40, 118 30, 122 18" stroke="#c9a3ab" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M200 32 C 214 40, 226 48, 232 60" stroke="#c9a3ab" stroke-width="1.8" stroke-linecap="round"/>
      <g fill="#f5d5dd">
        <circle cx="122" cy="14" r="9"/><circle cx="234" cy="63" r="9"/>
        <circle cx="58" cy="62" r="7"/><circle cx="286" cy="17" r="7"/>
      </g>
      <g fill="#eebfcc">
        <circle cx="160" cy="28" r="10"/><circle cx="30" cy="70" r="6"/>
      </g>
      <g fill="#fff">
        <circle cx="122" cy="14" r="2.6"/><circle cx="234" cy="63" r="2.6"/>
        <circle cx="160" cy="28" r="3"/><circle cx="58" cy="62" r="2.2"/>
        <circle cx="286" cy="17" r="2.2"/><circle cx="30" cy="70" r="2"/>
      </g>
    </svg>
    <p class="cover-eyebrow reveal">WEDDING INVITATION</p>
    <h1 class="cover-names reveal">
      <span data-bind="groom.name"></span>
      <em>그리고</em>
      <span data-bind="bride.name"></span>
    </h1>
    <figure class="cover-photo reveal">
      <img data-src="cover.photo" alt="웨딩 사진" />
    </figure>
    <p class="cover-date reveal" data-bind="fmt.coverDate"></p>
    <p class="cover-venue reveal" data-bind="fmt.coverVenue"></p>
    <div class="scroll-hint" aria-hidden="true"><span></span></div>
  </section>

  <!-- 초대글 -->
  <section class="section greeting">
    <div class="ornament reveal" aria-hidden="true">
      <svg viewBox="0 0 40 40" width="30" height="30">
        <g transform="translate(20 20)" fill="#eebfcc">
          <ellipse cx="0" cy="-9" rx="4.6" ry="8" />
          <ellipse cx="0" cy="-9" rx="4.6" ry="8" transform="rotate(72)" />
          <ellipse cx="0" cy="-9" rx="4.6" ry="8" transform="rotate(144)" />
          <ellipse cx="0" cy="-9" rx="4.6" ry="8" transform="rotate(216)" />
          <ellipse cx="0" cy="-9" rx="4.6" ry="8" transform="rotate(288)" />
        </g>
        <circle cx="20" cy="20" r="3.2" fill="#fff" />
      </svg>
    </div>
    <h2 class="section-title reveal" data-bind="greeting.title"></h2>
    <p class="greeting-message reveal" data-bind="greeting.message"></p>
    <div class="parents reveal">
      <p><span data-bind="groom.father"></span> · <span data-bind="groom.mother"></span>의 <span data-bind="groom.order"></span> <b data-bind="groom.name"></b></p>
      <p><span data-bind="bride.father"></span> · <span data-bind="bride.mother"></span>의 <span data-bind="bride.order"></span> <b data-bind="bride.name"></b></p>
    </div>
    <div class="contact-row reveal">
      <a class="btn-ghost" data-tel="groom.phone">신랑에게 연락하기</a>
      <a class="btn-ghost" data-tel="bride.phone">신부에게 연락하기</a>
    </div>
  </section>

  <!-- 날짜 -->
  <section class="section when">
    <h2 class="section-title reveal">예식 안내</h2>
    <p class="when-date reveal" data-bind="fmt.fullDate"></p>
    <div class="calendar reveal" id="calendar" aria-label="예식일 달력"></div>
    <p class="dday reveal" id="dday"></p>
  </section>

  <!-- 갤러리 -->
  <section class="section gallery-section">
    <h2 class="section-title reveal">우리의 순간</h2>
    <div class="gallery reveal" id="gallery"></div>
  </section>

  <!-- 오시는 길 -->
  <section class="section where">
    <h2 class="section-title reveal">오시는 길</h2>
    <p class="where-venue reveal"><b data-bind="wedding.venueName"></b> <span data-bind="wedding.hall"></span></p>
    <p class="where-address reveal" data-bind="wedding.address"></p>
    <div class="map-buttons reveal">
      <a class="btn-ghost" id="kakao-map" target="_blank" rel="noopener">카카오맵</a>
      <a class="btn-ghost" id="naver-map" target="_blank" rel="noopener">네이버지도</a>
      <button class="btn-ghost" id="copy-address">주소 복사</button>
    </div>
  </section>

  <!-- 마음 전하실 곳 -->
  <section class="section money">
    <h2 class="section-title reveal">마음 전하실 곳</h2>
    <p class="money-note reveal">참석이 어려워 마음만 전하고 싶으신 분들을 위해<br />계좌번호를 안내드립니다.</p>
    <div class="accordion reveal" id="accounts"></div>
  </section>

  <!-- 푸터 -->
  <footer class="footer">
    <p class="footer-names">
      <span data-bind="groom.name"></span> · <span data-bind="bride.name"></span>
    </p>
    <button class="btn-ghost" id="share">청첩장 공유하기</button>
    <p class="footer-brand">모시다 · mosida</p>
  </footer>
</main>

<div class="lightbox" id="lightbox" hidden>
  <img id="lightbox-img" alt="사진 크게 보기" />
</div>

<div class="toast" id="toast" role="status"></div>

<script src="data.js"></script>
<script>window.INVITE.bgm = { src: "/assets/bgm/serene.wav" };</script>
<script src="invite.js"></script>
<script src="/assets/bgm.js"></script>
</body>
</html>
