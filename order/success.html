<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>주문 완료 — 모시다</title>
<meta name="robots" content="noindex" />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Hahmlet:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="order.css" />
</head>
<body>
<header class="topbar"><a href="../" class="brand">모시다</a></header>
<main class="result-wrap">
  <div class="icon">🕊️</div>
  <h1 id="title">결제를 확인하고 있습니다…</h1>
  <p id="desc">잠시만 기다려주세요.</p>
  <a class="btn" href="../">홈으로</a>
</main>
<script>
(async function () {
  const q = new URLSearchParams(location.search);
  const saved = JSON.parse(sessionStorage.getItem("mosida_order") || "null");
  const title = document.getElementById("title");
  const desc = document.getElementById("desc");

  const done = () => {
    title.textContent = "주문이 완료되었습니다";
    desc.innerHTML = "감사합니다! 입력하신 번호로 <b>24시간 이내</b>에 완성된 청첩장 링크를 보내드립니다.<br />사진은 문자로 안내되는 방법으로 보내주세요.";
  };

  try {
    const res = await fetch("/api/confirm", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        paymentKey: q.get("paymentKey"),
        orderId: q.get("orderId"),
        amount: Number(q.get("amount")),
        order: saved && saved.order,
      }),
    });
    if (!res.ok) throw new Error("confirm failed: " + res.status);
    sessionStorage.removeItem("mosida_order");
    done();
  } catch (e) {
    // 승인 API 실패 시에도 고객을 막지 않는다 — 결제 대사(對査)는 운영자가 토스 대시보드에서 확인
    console.error(e);
    title.textContent = "결제는 접수되었습니다";
    desc.innerHTML = "확인 과정에서 일시적인 문제가 있었습니다.<br />결제가 완료되었다면 순차적으로 연락드리며,<br />궁금하시면 아래로 문의해주세요.";
  }
})();
</script>
</body>
</html>
