<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>청첩장 주문하기 — 모시다</title>
<meta name="description" content="모바일 청첩장 주문 — 정보 입력 후 바로 제작이 시작됩니다." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Hahmlet:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="order.css" />
<script src="https://js.tosspayments.com/v2/standard"></script>
</head>
<body>
<header class="topbar"><a href="/" class="brand">모시다</a></header>

<main class="order-wrap">
  <h1>청첩장 주문하기</h1>
  <p class="lead">아래 정보를 입력하시면 결제 후 <b>24시간 이내</b>에<br />나만의 청첩장 링크를 보내드립니다.</p>

  <form id="order-form" novalidate>
    <fieldset>
      <legend>템플릿 선택</legend>
      <div class="template-pick" id="template-pick">
        <label><input type="radio" name="template" value="danyeon" checked />
          <span class="pick-card"><b>담연</b><small>맑고 고요한 클래식</small></span></label>
        <label><input type="radio" name="template" value="haneul" disabled />
          <span class="pick-card"><b>하늘</b><small>준비 중</small></span></label>
        <label><input type="radio" name="template" value="dahm" disabled />
          <span class="pick-card"><b>담음</b><small>준비 중</small></span></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>신랑 · 신부</legend>
      <div class="grid2">
        <label>신랑 이름 <input name="groomName" required placeholder="김도현" /></label>
        <label>신부 이름 <input name="brideName" required placeholder="이서연" /></label>
        <label>신랑 연락처 <input name="groomPhone" type="tel" required placeholder="010-0000-0000" /></label>
        <label>신부 연락처 <input name="bridePhone" type="tel" required placeholder="010-0000-0000" /></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>예식 정보</legend>
      <label>예식 일시 <input name="weddingAt" type="datetime-local" required /></label>
      <label>예식장 이름 <input name="venueName" required placeholder="더채플앳청담" /></label>
      <label>홀 / 층 <input name="hall" placeholder="채플홀 3층" /></label>
      <label>예식장 주소 <input name="address" required placeholder="서울 강남구 선릉로 757" /></label>
    </fieldset>

    <fieldset>
      <legend>추가 정보 <small>(선택 — 비워두시면 저희가 예쁘게 채워드립니다)</small></legend>
      <label>인사말 <textarea name="greeting" rows="4" placeholder="초대 인사말을 적어주세요"></textarea></label>
      <label>요청사항 <textarea name="request" rows="3" placeholder="혼주 성함, 계좌번호, 기타 요청은 여기에 적어주세요"></textarea></label>
      <p class="hint">📷 사진은 결제 완료 후 안내되는 카카오톡 채널로 보내주시면 됩니다.</p>
    </fieldset>

    <fieldset>
      <legend>주문자 연락처</legend>
      <label>휴대폰 번호 <input name="ordererPhone" type="tel" required placeholder="완성본 링크를 받으실 번호" /></label>
    </fieldset>

    <div class="price-box">
      <span>모든 기능 포함 단일가</span>
      <b>24,900원</b>
    </div>

    <div id="payment-method"></div>
    <div id="agreement"></div>

    <button type="submit" class="pay-btn" id="pay-btn">24,900원 결제하기</button>
    <p class="pay-note">결제 완료 후 24시간 이내 완성 · 수정 무제한 · 마음에 안 들면 전액 환불</p>
  </form>
</main>

<script src="order.js"></script>
</body>
</html>
